<div class="register-container">
  <div class="register-card">
    <h1>Crear Cuenta</h1>
    <p class="subtitle">Únete a ProjectFlow</p>

    <form (ngSubmit)="onRegister()" class="register-form">
      <div class="form-group">
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="tu@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña:</label>
        <input
          type="password"
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" class="btn-primary">✍️ Crear Cuenta</button>
    </form>

    <div class="register-footer">
      <p>¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia Sesión</a></p>
    </div>
  </div>
</div>
